<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Peminjaman Inventaris</title>
    <style>
        /* CSS Reset dan Box Model */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Mengatur agar halaman berada di tengah secara vertikal dan horizontal menggunakan Flexbox */
        body {
            font-family: Times New Roman, Times, serif, Helvetica, sans-serif;
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kotak Form Login */
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-card h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: center;
        }

        /* Styling Form Group */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Tombol Login */
        .btn-login {
            width: 100%;
            padding: 10px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-login:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Login Borrow Master</h2>
        <!-- Form statis dengan atribut required sesuai materi validasi ringan -->
        <form action="dashboard.html" method="GET">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="admin@inventaris.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Kata Sandi:</label>
                <input type="password" id="password" name="password" placeholder="Minimal 6 karakter" minlength="6" required>
            </div>

            <button type="submit" class="btn-login">Masuk</button>
        </form>
    </div>

</body>
</html>
